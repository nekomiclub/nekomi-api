name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

env:
  # Implicitly provide env variables for tests
  HOST: ${{ vars.HOST }}
  PORT: ${{ vars.PORT }}

  ENV: ${{ vars.ENV }}

  DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
  DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
  DATABASE_USR: ${{ secrets.DATABASE_USR }}
  DATABASE_PWD: ${{ secrets.DATABASE_PWD }}

  API_KEY_SK: ${{ secrets.API_KEY_SK }}

  MAL_CLIENT_SK: ${{ secrets.MAL_CLIENT_SK }}
  ASHDI_API_SK: ${{ secrets.ASHDI_API_SK }}
  MOONANIME_API_SK: ${{ secrets.MOONANIME_API_SK }}
  IDS_MOE_SK: ${{ secrets.IDS_MOE_SK }}
  USER_SESSION_SK: ${{ secrets.USER_SESSION_SK }}

  NEKOMI_API_URL: ${{ vars.NEKOMI_API_URL }}
  NEKOMI_NEXTJS_URL: ${{ vars.NEKOMI_NEXTJS_URL }}
  NEKOMI_UPLOAD_SERVICE_URL: ${{ vars.NEKOMI_UPLOAD_SERVICE_URL }}
  ASHDI_API_URL: ${{ vars.ASHDI_API_URL }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    if: github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'Merge pull request')

    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
name: Publish Docker Image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  KEEP_VERSIONS: 6

  # Implicitly provide env variables for tests
  HOST: ${{ vars.HOST }}
  PORT: ${{ vars.PORT }}

  ENV: ${{ vars.ENV }}

  DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
  DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
  DATABASE_USR: ${{ secrets.DATABASE_USR }}
  DATABASE_PWD: ${{ secrets.DATABASE_PWD }}

  API_KEY_SK: ${{ secrets.API_KEY_SK }}

  MAL_CLIENT_SK: ${{ secrets.MAL_CLIENT_SK }}
  ASHDI_API_SK: ${{ secrets.ASHDI_API_SK }}
  MOONANIME_API_SK: ${{ secrets.MOONANIME_API_SK }}
  IDS_MOE_SK: ${{ secrets.IDS_MOE_SK }}
  USER_SESSION_SK: ${{ secrets.USER_SESSION_SK }}

  NEKOMI_NEXTJS_URL: ${{ vars.NEKOMI_NEXTJS_URL }}
  NEKOMI_UPLOAD_SERVICE_URL: ${{ vars.NEKOMI_UPLOAD_SERVICE_URL }}

jobs:
  test-and-build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
  
      - name: Lint
        run: pnpm lint
  
      - name: Type check
        run: pnpm typecheck
  
      - name: Test
        run: pnpm test
  
      - name: Build
        run: pnpm build

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.meta.outputs.version }}
name: Build & Deploy

on: 
  workflow_dispatch: 
  push:
    branches: 'main'
  
env:
  SERVICE_NAME: nekomi-api

jobs:
  build:
    name: Build & Test
    runs-on: self-hosted
  
    steps:
      - name: Get the repository
        uses: actions/checkout@v4
      - name: Setup nodejs
        uses: actions/setup-node@v4
      - name: Install dependencies
        run: npm i
      - name: Copy env file
        run: cp ~/nekomi/.config/env/$SERVICE_NAME.env ./.env
      - name: Copy firebase file
        run: cp ~/nekomi/.config/env/nekomi-api-firebase.json ./firebase.json
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build

  deploy:
    name: Deploy to the docker
    runs-on: self-hosted
    needs: build

    steps:
      - name: Prepare workdir
        run: rm -rf ~/nekomi/$SERVICE_NAME && mkdir -p ~/nekomi/$SERVICE_NAME
      - name: Copy files in workdir
        run: cp -r ./* ./.env ~/nekomi/$SERVICE_NAME
      - name: Create docker image
        run: docker build -t $SERVICE_NAME ~/nekomi/$SERVICE_NAME
      - name: Restart compose service
        run: cd ~/nekomi && docker-compose up -d --force-recreate --renew-anon-volumes --no-deps $SERVICE_NAME